name: Build

on:
  push:
    branches: [ main ]
    paths:
      - '**'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - dev-prod

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app's JavaScript (main, preload, renderer) is the same on every
  # platform: electron-vite builds it once here, and each platform job only
  # packages it with electron-builder.
  app:
    name: Build app (JS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_DEV_PROD: ${{ github.event.inputs.build_type == 'dev-prod' && 'true' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-environment

      - name: Build main, preload and renderer
        run: npm run build

      - name: Upload the app build
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    needs: app
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            platform: linux
            arch: x64

          # Windows
          - os: windows-latest
            platform: win
            arch: x64

          # macOS Universal (Intel + Apple Silicon): the only macOS build
          - os: macos-latest
            platform: mac
            arch: universal

    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_DEV_PROD: ${{ github.event.inputs.build_type == 'dev-prod' && 'true' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the platform's node_modules: electron-builder packages the
      # production dependencies, native modules included, for this platform.
      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          os: ${{ matrix.os }}

      - name: Download the app build
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: dist

      # Linux Package
      - name: Package for Linux
        if: matrix.platform == 'linux'
        run: npm run package:linux

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: datalayer-desktop-linux-${{ matrix.arch }}
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.snap
          retention-days: 30

      # Windows Package
      - name: Package for Windows
        if: matrix.platform == 'win'
        shell: bash
        run: npm run package:win

      - name: Upload Windows artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: datalayer-desktop-win-${{ matrix.arch }}
          path: |
            dist-electron/*.exe
            dist-electron/*.msi
          retention-days: 30

      # macOS Package (unsigned)
      - name: Package for macOS
        if: matrix.platform == 'mac'
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: datalayer-desktop-mac-${{ matrix.arch }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.pkg
          retention-days: 30

      # Upload build logs on failure
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            npm-debug.log
            dist-electron/builder-debug.yml
            dist-electron/builder-effective-config.yaml
          retention-days: 7

  test-artifacts:
    name: Test Artifacts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: success()

    steps:
      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          pattern: datalayer-desktop-*
          path: artifacts

      - name: Check the three installers are there
        run: |
          set -e
          ls artifacts/datalayer-desktop-linux-x64/*.AppImage
          ls artifacts/datalayer-desktop-win-x64/*.exe
          ls artifacts/datalayer-desktop-mac-universal/*-universal.dmg

      - name: Check artifact sizes
        run: |
          echo "Artifact Sizes:"
          find artifacts -type f \( -name "*.AppImage" -o -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) -exec ls -lh {} \;
