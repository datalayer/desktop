name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v0.0.2, v1.0.0, etc.

permissions:
  contents: write  # Required for creating releases

jobs:
  # The checks and the app's JavaScript (main, preload, renderer) run once on
  # Linux; each platform job then only packages that build.
  build-app:
    name: Check and build the app (JS)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'

      - name: Verify package.json version matches tag
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PACKAGE_VERSION"

      - name: Run linter
        run: npm run lint

      # Type-checks, then electron-vite builds main, preload and renderer.
      - name: Build application
        run: npm run build

      - name: Upload the app build
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build-and-release:
    name: Build and Release (${{ matrix.os }})
    needs: build-app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      matrix:
        include:
          # macOS Universal (Intel + Apple Silicon)
          - os: macos-latest
            platform: mac
            arch: universal

          # Windows x64
          - os: windows-latest
            platform: win
            arch: x64

          # Linux x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The platform's node_modules: electron-builder packages the production
      # dependencies, native modules included, for this platform.
      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'
          os: ${{ matrix.os }}

      - name: Download the app build
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: dist

      # Package for each platform (unsigned builds for GitHub Releases only)
      - name: Package application (macOS)
        if: matrix.platform == 'mac'
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package application (Windows)
        if: matrix.platform == 'win'
        run: npm run package:win

      - name: Package application (Linux)
        if: matrix.platform == 'linux'
        run: npm run package:linux

      - name: List artifacts
        shell: bash
        run: |
          echo "Generated artifacts:"
          ls -lh dist-electron/

      # Upload artifacts to GitHub Actions
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: datalayer-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.msi
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
          if-no-files-found: error
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          # The version's own section of CHANGELOG.md: `## <version>` up to the
          # next `## `. A tag whose version has no section fails here rather
          # than publishing a release without its notes.
          NOTES=$(awk -v v="## $VERSION" '$0 == v { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md | sed '/./,$!d')
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section '## $VERSION'."
            exit 1
          fi
          {
            echo "## What's Changed"
            echo
            printf '%s\n' "$NOTES"
            echo
            cat << 'EOF'
          ## Downloads

          Choose the appropriate installer for your platform:
          - **macOS**: `.dmg` (Intel & Apple Silicon Universal)
          - **Windows**: `.exe` installer
          - **Linux**: `.AppImage` (portable), `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL)

          ## Installation

          ### macOS
          1. Download the `.dmg` file
          2. Open it and drag Datalayer Desktop to Applications
          3. On first launch, right-click → Open to bypass Gatekeeper

          ### Windows
          1. Download the `.exe` file
          2. Run the installer
          3. Follow the installation wizard

          ### Linux
          **AppImage (Recommended)**
          1. Download the `.AppImage` file
          2. Make it executable: `chmod +x Datalayer-Desktop-*.AppImage`
          3. Run it: `./Datalayer-Desktop-*.AppImage`

          **Debian/Ubuntu**
          ```bash
          sudo dpkg -i datalayer-desktop_*_amd64.deb
          ```

          **Fedora/RHEL**
          ```bash
          sudo rpm -i datalayer-desktop-*.x86_64.rpm
          ```
          EOF
          } > CHANGELOG.txt
          cat CHANGELOG.txt

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          pattern: datalayer-desktop-*
          path: artifacts/

      - name: Display artifact structure
        run: ls -R artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Datalayer Desktop ${{ steps.extract_version.outputs.version }}
          body_path: CHANGELOG.txt
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
          draft: false
          prerelease: ${{ contains(steps.extract_version.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
