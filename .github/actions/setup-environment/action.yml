name: 'Setup Build Environment'
description: 'Set up Node.js and install the desktop dependencies (the Datalayer packages come from npm)'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  os:
    description: 'Operating system (for Windows-specific handling)'
    required: false
    default: 'ubuntu-latest'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install desktop dependencies
      shell: bash
      run: |
        if [ "${{ inputs.os }}" == "windows-latest" ]; then
          echo "Installing on Windows with --force flag to bypass OS restrictions"
          npm install --force
        else
          npm install
        fi
